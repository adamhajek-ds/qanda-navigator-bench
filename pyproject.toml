[project]
name = "qanda-navigator-bench"
version = "0.1.0"
description = "Benchmark how efficiently AI coding agents navigate codebases and answer developer questions"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.scripts]
qnb = "qnb.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qnb"]
